<!DOCTYPE html>
<html>
<head>
  <title>Prompt Logs</title>

  <style>
    body{
      margin:0;
      padding:12px;
      width:320px;
      font-family: "Segoe UI", Arial, sans-serif;
      background:#0f172a;
      color:#e2e8f0;
    }

    h3{
      margin-top:0;
      margin-bottom:12px;
      font-size:16px;
      font-weight:600;
      color:#38bdf8;
      border-bottom:1px solid #1e293b;
      padding-bottom:6px;
    }

    #promptList{
      max-height:380px;
      overflow-y:auto;
    }

    .prompt{
      background:#1e293b;
      border:1px solid #334155;
      border-radius:8px;
      padding:8px 10px;
      margin-bottom:8px;
      font-size:13px;
      line-height:1.4;
      transition:all 0.2s ease;
    }

    .prompt:hover{
      background:#273449;
      border-color:#38bdf8;
    }

    /* Scrollbar styling */
    #promptList::-webkit-scrollbar{
      width:6px;
    }

    #promptList::-webkit-scrollbar-thumb{
      background:#334155;
      border-radius:4px;
    }

  </style>
</head>

<body>

<h3>Captured Prompts</h3>

<div id="promptList"></div>

<script src="popup.js"></script>

</body>
</html>
