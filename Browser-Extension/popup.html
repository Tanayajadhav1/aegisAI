<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<style>

body{
width:260px;
margin:0;
padding:20px;
background:#0f172a;
color:white;
font-family:Arial, Helvetica, sans-serif;
}

.container{
display:flex;
flex-direction:column;
gap:12px;
}

.title{
font-size:18px;
font-weight:bold;
color:#22d3ee;
text-align:center;
}

.subtitle{
font-size:12px;
color:#94a3b8;
text-align:center;
margin-bottom:8px;
}

input{
padding:10px;
border-radius:6px;
border:1px solid #334155;
background:#020617;
color:white;
outline:none;
}

input::placeholder{
color:#64748b;
}

input:focus{
border:1px solid #22d3ee;
box-shadow:0 0 5px #22d3ee;
}

button{
padding:10px;
border:none;
border-radius:6px;
background:#06b6d4;
color:white;
font-weight:bold;
cursor:pointer;
transition:all 0.2s;
}

button:hover{
background:#0891b2;
transform:scale(1.03);
}

.status{
font-size:12px;
text-align:center;
color:#22c55e;
}

.footer{
margin-top:8px;
font-size:10px;
text-align:center;
color:#64748b;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
Aegis AI Firewall
</div>

<div class="subtitle">
Enter your Company ID
</div>

<input id="company" placeholder="Company ID">

<button id="save">
Connect Firewall
</button>

<div id="status" class="status"></div>

<div class="footer">
AI Prompt Protection Enabled
</div>

</div>

<script src="popup.js"></script>

</body>
</html>
